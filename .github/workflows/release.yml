name: Release
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
              raise SystemExit("Release version must use numeric MAJOR.MINOR.FIX")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match Cargo.toml: v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PYTHON
      - uses: ./web/ci/setup
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --locked --workspace --all-targets

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate image tags and OCI labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Binbin
            org.opencontainers.image.description=Private file sharing with resumable uploads and expiring links
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: binbin:test
          cache-from: type=gha,scope=binbin-image
          cache-to: type=gha,scope=binbin-image,mode=max
      - name: Smoke test image
        run: bash scripts/docker-smoke.sh binbin:test
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=binbin-image
          cache-to: type=gha,scope=binbin-image,mode=max
          provenance: mode=max
          sbom: true
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf '### Published image\n\n`%s@%s`\n\nTags:\n```text\n%s\n```\n' \
            "$IMAGE" "$DIGEST" "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  cli:
    name: CLI ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Older runners keep the glibc requirement low for Linux users.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --locked --release -p binbin-cli --bin binbin --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="binbin-${VERSION}-${TARGET}"
          tar -C "target/${TARGET}/release" -czf "${name}.tar.gz" binbin
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          gh release upload "$TAG" "${name}.tar.gz" "${name}.tar.gz.sha256" --clobber

  homebrew:
    name: Update Homebrew tap
    needs: [verify, image, cli]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir checksums
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha() { cut -d' ' -f1 "checksums/binbin-${VERSION}-$1.tar.gz.sha256"; }
          url() { echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/binbin-${VERSION}-$1.tar.gz"; }
          mkdir -p tap/Formula
          cat > tap/Formula/binbin.rb <<RUBY
          class Binbin < Formula
            desc "Binbin file-sharing client"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "$(url aarch64-apple-darwin)"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$(url x86_64-apple-darwin)"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              depends_on "dbus"
              on_arm do
                url "$(url aarch64-unknown-linux-gnu)"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$(url x86_64-unknown-linux-gnu)"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "binbin"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/binbin --version")
            end
          end
          RUBY
      - name: Commit and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/binbin.rb
          git diff --cached --quiet || git commit -m "chore: update binbin to ${VERSION}"
          git push
