name: Build web client
description: Install pinned web dependencies and compile assets for the Rust server.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - run: npm ci
      working-directory: web
      shell: bash
    - run: npm run build
      working-directory: web
      shell: bash
